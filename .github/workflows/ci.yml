name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  native-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java
          - os: macos-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java
          - os: windows-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :cli:nativeCompile
        shell: bash
      - run: ${{ matrix.executable }} --help
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: sql-formatter-java-${{ matrix.os }}
          path: cli/build/native/nativeCompile/sql-formatter-java*

  publish-plugin:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.X.X: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: ./gradlew :gradle-plugin:publishPlugins -PreleaseVersion=${GITHUB_REF_NAME#v}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
