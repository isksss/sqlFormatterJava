name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Run Gradle checks with Java backend
        run: ./gradlew check --rerun-tasks

      - name: Build Rust core executable
        run: cargo build -p sql-formatter-core

      - name: Run Rust backend integration tests
        env:
          SQL_FORMATTER_TEST_RUST_CORE: ${{ github.workspace }}/target/debug/sql-formatter-core
        run: ./gradlew :cli:test :gradle-plugin:test --tests '*RustCoreBackend*' --rerun-tasks

      - name: Run all Gradle tests with Rust backend
        env:
          SQL_FORMATTER_RUST_CORE: ${{ github.workspace }}/target/debug/sql-formatter-core
        run: ./gradlew test --rerun-tasks

      - name: Compile VS Code extension with Wasm
        working-directory: vscode-extension
        run: npm run compile:with-wasm
