name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  native-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java
            artifact_name: sql-formatter-java-linux
            asset_name: sql-formatter-java-linux
          - os: macos-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java
            artifact_name: sql-formatter-java-macos
            asset_name: sql-formatter-java-macos
          - os: windows-latest
            executable: ./cli/build/native/nativeCompile/sql-formatter-java.exe
            artifact_name: sql-formatter-java-windows
            asset_name: sql-formatter-java-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :cli:nativeCompile
        shell: bash
      - run: ${{ matrix.executable }} --help
        shell: bash
      - run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/${{ matrix.asset_name }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

  release-cli:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - native-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.X.X: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: sql-formatter-java-*
          path: dist
          merge-multiple: true
      - name: Package release assets
        run: |
          mkdir -p release
          chmod +x dist/sql-formatter-java-linux dist/sql-formatter-java-macos
          tar -C dist -czf "release/sql-formatter-java-${GITHUB_REF_NAME}-linux.tar.gz" sql-formatter-java-linux
          tar -C dist -czf "release/sql-formatter-java-${GITHUB_REF_NAME}-macos.tar.gz" sql-formatter-java-macos
          (cd dist && zip "../release/sql-formatter-java-${GITHUB_REF_NAME}-windows.zip" sql-formatter-java-windows.exe)
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-plugin:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.X.X: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: ./gradlew :gradle-plugin:publishPlugins -PreleaseVersion=${GITHUB_REF_NAME#v}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
