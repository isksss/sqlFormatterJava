plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
}

dependencies {
    implementation project(':core')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/isksss/sqlFormatterJava'
    vcsUrl = 'https://github.com/isksss/sqlFormatterJava'

    plugins {
        sqlFormatter {
            id = 'dev.isksss.java.sql-formatter'
            implementationClass = 'dev.isksss.java.sqlformatter.gradle.SqlFormatterPlugin'
            displayName = 'Java SQL Formatter'
            description = 'Formats SQL files from Gradle with a Java SQL formatter.'
            tags = ['sql', 'formatter', 'gradle-plugin']
        }
    }
}
